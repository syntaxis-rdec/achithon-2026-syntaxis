[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate"
version = "1.0.0"
description = "Deterministic, Zero-Authority Policy Gateway for Autonomous AI Agent Tool Actions"
readme = "README.md"
authors = [{ name = "Syntaxis Team 9-11", email = "team9-11@archithon2026.example" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["ai-safety", "policy-gateway", "agent-security", "zero-trust", "merkle-audit", "bell-lapadula"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "sqlite3",
]

[project.optional-dependencies]
web = [
    "flask>=3.0",
    "streamlit>=1.36",
    "pandas>=2.2",
    "python-pptx>=1.0.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
agentgate = "start:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

